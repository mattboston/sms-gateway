version: "2"
linters:
  # errcheck, govet, ineffassign, staticcheck and unused are enabled by default
  # in v2, and gosimple is now part of staticcheck. Only extras need listing.
  enable:
    - revive
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - revive
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
      # Vendored Go sources shipped inside npm packages (src/web/node_modules).
      - node_modules
formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - node_modules

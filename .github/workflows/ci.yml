name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Build frontend
        run: cd src/web && npm ci && npm run build

      - name: ESLint
        run: cd src/web && npm run lint

      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: src
          version: v2.12.2

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Build frontend
        run: cd src/web && npm ci && npm run build

      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Run Go tests
        run: cd src && go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: src/coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Build frontend
        run: cd src/web && npm ci && npm run build

      - name: Build Go binary
        run: cd src && CGO_ENABLED=0 go build -o ../bin/sms-gateway ./cmd/sms-gateway

      - name: Verify swagger docs are up to date
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          cd src && swag init -g cmd/sms-gateway/main.go -o docs --parseDependency --parseInternal
          git diff --exit-code docs/ || (echo "Swagger docs are out of date. Run 'just swagger' and commit." && exit 1)

  # Builds the release container without publishing it. The release workflow is
  # what pushes to GHCR; this job exists so a broken Dockerfile fails a pull
  # request instead of a tagged release — the 0.1.5 release failed here because
  # the Go base image had drifted behind the go directive in src/go.mod.
  container:
    name: Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to read and write the buildx layer cache.
      actions: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # linux/amd64 only. The release builds arm64 too, but that goes through
      # QEMU emulation and is slow; amd64 alone catches Dockerfile and
      # toolchain breakage, which is what this job is for.
      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
